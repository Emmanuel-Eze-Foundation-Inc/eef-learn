name: CI

# The same checks as `pnpm verify` on our machines (Unseen Engine playbook), plus a secret scan
# and a clean-clone compose boot.
on:
  pull_request:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eef
          POSTGRES_PASSWORD: eef
          POSTGRES_DB: eef_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eef" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eef:eef@localhost:5432/eef_test
      TEST_DATABASE_URL: postgresql://eef:eef@localhost:5432/eef_test
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789
      AUTH_URL: http://localhost:3000
      AI_SERVICE_TOKEN: ci-only-token
      AI_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eef/db generate
      - run: pnpm --filter @eef/db exec prisma migrate deploy
      - run: cd apps/ai && uv sync
      - run: pnpm verify

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks CLI (the Gitleaks Action needs a paid licence for organisation repos)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v

  compose-smoke:
    name: Clean-clone compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot postgres + migrate + seed
        run: |
          cp .env.example .env
          docker compose up -d postgres
          docker compose run --rm migrate
      - name: AI service boots and answers /health
        run: |
          docker compose up -d ai
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"ok":true'; then exit 0; fi
            sleep 2
          done
          docker compose logs ai
          exit 1
